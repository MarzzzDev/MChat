name: Update DankChat badges

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download DankChat badges
        run: |
          mkdir -p data
          curl -fsSL --retry 3 "https://flxrs.com/api/badges" -o /tmp/dankchat.json
          jq -e . /tmp/dankchat.json > /dev/null
          cp /tmp/dankchat.json data/dankchat-badges.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dankchat-badges.json
          git diff --staged --quiet || git commit -m "Update DankChat badges"
          git push
